# must be unique in a given SonarQube instance
sonar.projectKey=com.bbva.datioamproduct:codatakbtqcddeconinformati
sonar.projectName=codatakbtqcddeconinformati
sonar.projectVersion=1.0.0-SNAPSHOT

# =====================================================
#   Definition of the modules
# =====================================================
sonar.modules=cddGlobalEcoInformation

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
sonar.scala.version=2.12.10
sonar.junit.reportsPath=target/surefire-reports
sonar.scoverage.reportPath=target/scoverage.xml