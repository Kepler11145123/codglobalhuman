# must be unique in a given SonarQube instance
sonar.projectKey=${package}:${artifactId}
sonar.projectName=${artifactId}
sonar.projectVersion=${version}

# =====================================================
#   Definition of the modules
# =====================================================
sonar.modules=kbtq-gl-spk-out-codatakbtqcddeconinformati-spark

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
kbtq-gl-spk-out-codatakbtqcddeconinformati-spark.sonar.sources=src/main
kbtq-gl-spk-out-codatakbtqcddeconinformati-spark.sonar.tests=src/test
kbtq-gl-spk-out-codatakbtqcddeconinformati-spark.sonar.java.binaries=target/classes
kbtq-gl-spk-out-codatakbtqcddeconinformati-spark.sonar.java.test.binaries=target/test-classes

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
sonar.scala.version=2.12.10
sonar.junit.reportsPath=target/surefire-reports
sonar.scoverage.reportPath=target/scoverage.xml